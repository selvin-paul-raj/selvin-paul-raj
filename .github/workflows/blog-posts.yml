name: Latest blog posts

# Refreshes the "Latest from the blog" list in README.md from the AI with SPR RSS feed.
on:
  schedule:
    - cron: "23 1 * * *" # daily, 06:53 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-posts
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull latest posts
        uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: "https://ai-with-spr.vercel.app/rss.xml"
          max_post_count: 5
          template: "- [$title]($url) <sub>· $date</sub>$newline"
          date_format: "UTC:mmm d, yyyy"
          tag_post_pre_newline: true
          enable_keepalive: false
          commit_message: "chore: refresh latest blog posts"
