name: WakaTime coding time (optional, off by default)

# Off until you add the secret WAKATIME_API_KEY and the repository variable
# ENABLE_WAKATIME = true, then un-comment the WakaTime block in README.md.
on:
  schedule:
    - cron: "50 2 * * *" # daily, 08:20 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-commits
  cancel-in-progress: false

jobs:
  waka:
    if: ${{ vars.ENABLE_WAKATIME == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: athul/waka-readme@8539bedb8277066fc9fe1b47d1f9b108eb866494 # v0.3.1
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: true
          TIME_RANGE: last_7_days
          LANG_COUNT: 6
