<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-labelledby="t d"><title id="t">01 WHOAMI</title><desc id="d">Section header: Whoami, who is running this agent.</desc>
<defs><linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="211" x2="952" y1="0" y2="0"><stop offset="0" stop-color="#0e7490"/><stop offset=".6" stop-color="#6d28d9"/><stop offset="1" stop-color="#6d28d9" stop-opacity="0"/></linearGradient>
<clipPath id="tc"><rect x="92" y="10" height="40" width="0"><animate attributeName="width" values="0;101" dur=".7s" begin=".1s" fill="freeze"/></rect></clipPath>
<filter id="glow"><feOffset dx="0" dy="0"/></filter></defs>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace} .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes dash{to{stroke-dashoffset:-40}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.in{opacity:0;animation:fadeUp .6s ease-out forwards}
.fd{opacity:0;animation:fade .6s ease-out forwards}
.bl{animation:blink 1s steps(1) infinite}
.pl{animation:pulse 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in,.fd{opacity:1}}

.ix{font:800 14px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;fill:#0e7490} .tt{font:800 22px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;fill:#0b1220;letter-spacing:1px}
.sb{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;fill:#5b6b85}
</style>
<rect x="20" y="16" width="56" height="30" rx="8" fill="#0e7490" fill-opacity=".1" stroke="#0e7490" stroke-opacity=".6"/>
<text x="48" y="36" text-anchor="middle" class="ix">01</text>
<rect x="18" y="14" width="60" height="34" rx="10" fill="none" stroke="#0e7490" opacity="0"><animate attributeName="opacity" values="0;.8;0" dur="2.4s" repeatCount="indefinite"/></rect>
<text x="92" y="39" class="tt" clip-path="url(#tc)">WHOAMI</text>
<rect x="193" y="20" width="10" height="22" fill="#0e7490" class="bl"/>
<line x1="211" y1="31" x2="952" y2="31" stroke="url(#ln)" stroke-width="2" stroke-dasharray="1200" stroke-dashoffset="1200"><animate attributeName="stroke-dashoffset" values="1200;0" dur="1.2s" begin=".4s" fill="freeze"/></line>
<circle r="3.5" cy="31" fill="#0e7490" filter="url(#glow)"><animate attributeName="cx" values="211;952" dur="3.5s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3.5s" begin="1.6s" repeatCount="indefinite"/></circle>
<text x="1170" y="36" text-anchor="end" class="sb fd" style="animation-delay:.9s">// who is running this agent</text>
<line x1="20" y1="62" x2="1180" y2="62" stroke="#c8d4e8" opacity=".6"/>
</svg>
