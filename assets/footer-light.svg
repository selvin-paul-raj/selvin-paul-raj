<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="t d"><title id="t">Footer</title><desc id="d">Animated footer: neon waves under the words Plan, retrieve, act, evaluate. Thanks for visiting.</desc>
<defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc" stop-opacity="0"/><stop offset="1" stop-color="#f8fafc" stop-opacity="0"/></linearGradient>
<clipPath id="cl"><rect width="1200" height="190" rx="18"/></clipPath><filter id="glow"><feOffset dx="0" dy="0"/></filter></defs>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace} .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes dash{to{stroke-dashoffset:-40}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.in{opacity:0;animation:fadeUp .6s ease-out forwards}
.fd{opacity:0;animation:fade .6s ease-out forwards}
.bl{animation:blink 1s steps(1) infinite}
.pl{animation:pulse 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in,.fd{opacity:1}}

.ft{font:800 22px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;fill:#0b1220;letter-spacing:3px} .fs{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;fill:#5b6b85;letter-spacing:1.5px}
.w1{fill:#0e7490} .w2{fill:#6d28d9} .w3{fill:#047857} .w4{fill:#be185d}
</style>
