<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d"><title id="t">Tech stack orbit</title><desc id="d">Animated orbit of Selvin's stack around an agent core. Inner ring, agent frameworks: LangGraph, Google ADK, MCP, RAG, DeepEval, LangChain. Middle ring, models and tooling: Claude, Gemini, Hugging Face, FAISS plus BM25, Pydantic, Playwright, FastAPI, Sentence-Transformers. Outer ring, engineering: Python, TypeScript, Docker, PostgreSQL, AWS, Next.js, React, Git, Linux, Vercel, Node.js, GitHub Actions.</desc>
