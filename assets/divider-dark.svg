<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="34" viewBox="0 0 1200 34" role="img" aria-labelledby="t d"><title id="t">Divider</title><desc id="d">Section divider: a data line with packets travelling between three hexagon nodes.</desc>
<defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="20" x2="1180"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".25" stop-color="#22d3ee" stop-opacity=".6"/><stop offset=".5" stop-color="#a78bfa" stop-opacity=".7"/><stop offset=".75" stop-color="#34d399" stop-opacity=".6"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<path d="M20 17 H1180" stroke="url(#g)" stroke-width="1.2" stroke-dasharray="2 4"/>
<rect y="16" width="40" height="2" rx="1" fill="#22d3ee" filter="url(#glow)"><animate attributeName="x" values="20;1180" dur="4.5s" begin="0s" repeatCount="indefinite"/></rect><rect y="16" width="18" height="2" rx="1" fill="#a78bfa" filter="url(#glow)"><animate attributeName="x" values="20;1180" dur="6s" begin="1.2s" repeatCount="indefinite"/></rect><rect y="16" width="26" height="2" rx="1" fill="#34d399" filter="url(#glow)"><animate attributeName="x" values="20;1180" dur="5.2s" begin="2.6s" repeatCount="indefinite"/></rect><path d="M300 9 l7 4 v8 l-7 4 l-7 -4 v-8 z" fill="#0b1328" stroke="#22d3ee" stroke-width="1.4"/><path d="M600 9 l7 4 v8 l-7 4 l-7 -4 v-8 z" fill="#0b1328" stroke="#a78bfa" stroke-width="1.4"/><path d="M900 9 l7 4 v8 l-7 4 l-7 -4 v-8 z" fill="#0b1328" stroke="#34d399" stroke-width="1.4"/>
</svg>
