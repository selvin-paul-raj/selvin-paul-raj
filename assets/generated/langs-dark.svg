<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" role="img" aria-labelledby="t d"><title id="t">Language mix</title><desc id="d">Languages across Selvin's own public repos (share of repos by main language): JavaScript 41%, Python 20%, CSS 16%, TypeScript 15%, C++ 4%, HTML 4%.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050814"/><stop offset="1" stop-color="#0a1024"/></linearGradient><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace} .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes dash{to{stroke-dashoffset:-40}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.in{opacity:0;animation:fadeUp .6s ease-out forwards}
.fd{opacity:0;animation:fade .6s ease-out forwards}
.bl{animation:blink 1s steps(1) infinite}
.pl{animation:pulse 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in,.fd{opacity:1}}
