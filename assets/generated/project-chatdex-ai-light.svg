<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-labelledby="t d"><title id="t">ChatDex AI</title><desc id="d">Project card: ChatDex AI. Chrome extension that indexes your ChatGPT and Gemini chats: search prompts, export Markdown/JSON, sync to Notion. Stack: Chrome Extension, JavaScript. ★ 1   ⑂ 0   ● JavaScript   · updated Mar 16, 2026</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef3fb"/></linearGradient><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#0e7490"/><stop offset=".5" stop-color="#6d28d9"/><stop offset="1" stop-color="#be185d"/></linearGradient><filter id="glow"><feOffset dx="0" dy="0"/></filter></defs><style>
